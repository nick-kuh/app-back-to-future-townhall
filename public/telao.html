<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telão · De Volta ao Futuro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0618'/%3E%3Cpath d='M36 6 L16 36 h14 L26 58 L48 26 H34 Z' fill='%23ffd21f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Michroma&family=Press+Start+2P&family=Share+Tech+Mono&family=Permanent+Marker&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="telao.css">
</head>
<body>
<div class="sky" aria-hidden="true">
  <canvas id="bg3d" class="bg3d"></canvas>
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="clocktower"></div>
  <div class="horizon"></div>
  <div class="grid"></div>
  <div class="flash" id="skyFlash"></div>
</div>
<div class="crt" aria-hidden="true"></div>

<div class="osd"><span></span><span class="mono" id="osdNow"></span></div>

<main id="scene" class="scene"></main>

<!-- transição entre blocos: circuitos de tempo, mostrador (88 MPH · 1,21 GW · 10:04), raio e rastros de fogo -->
<div class="tr" id="tr" aria-hidden="true">
  <div class="tr-lines"></div>
  <div class="tr-box">
    <div class="circuits tr-circ">
      <div class="tc r"><label>DESTINATION TIME</label><div class="led" id="trDest"></div></div>
      <div class="tc g"><label>PRESENT TIME</label><div class="led" id="trNow"></div></div>
      <div class="tc a"><label>LAST TIME DEPARTED</label><div class="led" id="trLast"></div></div>
    </div>
    <div class="tr-gauge"><b id="trNum">00</b><span id="trUnit">MPH</span></div>
    <div class="tr-end">CONTINUA…</div>
    <div class="tr-quote" id="trQuote"></div>
  </div>
  <div class="tr-fire"></div><div class="tr-fire f2"></div>
  <div class="tr-flash"></div>
</div>

<button id="soundChip" class="sound-chip" type="button" hidden>🔊 Clique aqui para ligar o som do telão</button>



<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="delorean3d.js"></script>
<script src="nuvem.js"></script>
<script src="flux.js"></script>
<script src="trilha.js"></script>
<script src="telao.js"></script>
</body>
</html>
