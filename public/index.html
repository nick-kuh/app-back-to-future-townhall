<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>De Volta ao Futuro · Townhall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Cpath d='M36 6 L16 36 h14 L26 58 L48 26 H34 Z' fill='%23ffd000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="horizon"></div>
  <div class="grid"></div>
  <div class="flash" id="skyFlash"></div>
</div>

<main id="app" class="app" aria-live="polite"></main>

<div id="warp" class="warp" aria-hidden="true">
  <div class="warp-lines"></div>
  <div class="warp-center">
    <div class="warp-speed"><span id="warpSpeed">0</span><small>MPH</small></div>
    <div class="warp-msg" id="warpMsg">ACELERANDO...</div>
  </div>
  <div class="fire f1"></div><div class="fire f2"></div>
  <div class="warp-flash"></div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
