<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07060f">
<title>Painel do Doc · De Volta ao Futuro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2335d6ff' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login">
  <form class="login-box" id="loginForm">
    <div class="kicker">Painel do Doc</div>
    <h1>🎛️ Acesso do apresentador</h1>
    <p class="muted">Digite a senha de admin para controlar o townhall.</p>
    <input class="input" id="pwd" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn" type="submit">Entrar</button>
    <p class="small" id="loginMsg"></p>
  </form>
</div>

<header class="top">
  <div class="brand"><span class="k">PAINEL DO DOC</span><span class="n">De Volta ao Futuro · Townhall</span></div>
  <div class="status" id="status"></div>
  <div class="audio" id="audioCtl" aria-label="Som do telão"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="control" class="on">Controle</button>
    <button data-tab="sucesso" class="suc-tab">🚀 Sucesso</button>
    <button data-tab="people">Pessoas</button>
    <button data-tab="questions">Perguntas</button>
    <button data-tab="config">Config</button>
    <button data-tab="tests">Testes</button>
    <a href="/" target="_blank" class="link">App do viajante ↗</a>
  </nav>
</header>

<main id="main" class="main"></main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="trilha.js"></script>
<script src="admin.js"></script>
</body>
</html>
