# Blueprint do Render (https://render.com) · deploy em um clique.
# Serviço web Node em Docker, plano gratuito. Para o dia do evento, suba para o
# plano Starter (sem hibernação) e, se quiser manter o banco entre reinícios,
# adicione um disco em /app/data pelo painel do Render.
services:
  - type: web
    name: townhall-de-volta-ao-futuro
    runtime: docker
    repo: https://github.com/nick-kuh/app-back-to-future-townhall
    branch: main
    plan: free
    region: virginia
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD      # senha mestra: o Painel do Doc completo (/admin.html)
        sync: false
      - key: DINAMICAS_PASSWORD  # senha das dinâmicas: o painel só com Conexões, Reflexão e Sucesso (/dinamicas)
        sync: false
      - key: ANTHROPIC_API_KEY  # opcional: a IA (Claude) escreve a mensagem do Doc na Visão 2027
        sync: false
      - key: FOTOS_KEY          # chave que abre o pacote de fotos de perfil (server/seed/fotos.enc); sem ela, o app usa as iniciais
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
